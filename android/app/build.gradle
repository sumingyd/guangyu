plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// 从 local.properties 读取 chaquopy.buildPython（如果存在），用于在 PATH 中找不到 Python 时指定路径
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}
def buildPythonPath = localProps.getProperty("chaquopy.buildPython")

// 从 PC 端 core/version.py 自动读取版本号，确保与 PC 端保持一致（唯一真源）
def versionFile = rootProject.file("../core/version.py")
if (!versionFile.exists()) {
    throw new GradleException("未找到版本文件: ${versionFile}，无法确定 versionName/versionCode")
}
def versionMatcher = versionFile.text =~ /CURRENT_VERSION\s*(?::\s*str\s*)?=\s*["']([^"']+)["']/
if (!versionMatcher.find()) {
    throw new GradleException("core/version.py 中无法解析 CURRENT_VERSION，拒绝使用默认版本号构建")
}
def versionNameStr = versionMatcher.group(1)

// versionCode 必须包含全部四段（含 build 段），否则仅第 4 段升级时
// versionCode 不变，用户永远收不到更新。
// 编码方式：major*1e7 + minor*1e5 + patch*1e2 + build（各段 0-99）
def versionParts = versionNameStr.tokenize('.')
if (versionParts.size() != 4) {
    throw new GradleException("CURRENT_VERSION 必须是 major.minor.patch.build 四段: ${versionNameStr}")
}
versionParts.each { part ->
    if (!(part ==~ /\d+/) || part.toInteger() > 99) {
        throw new GradleException("版本号各段必须是 0-99 的整数: ${versionNameStr}")
    }
}
def (vMajor, vMinor, vPatch, vBuild) = versionParts.collect { it.toInteger() }
if (vMajor > 209) {
    throw new GradleException("主版本号过大，versionCode 将超出 Android 上限 2100000000: ${versionNameStr}")
}
def versionCodeVal = vMajor * 10000000 + vMinor * 100000 + vPatch * 100 + vBuild
if (versionCodeVal > 2100000000) {
    throw new GradleException("计算出的 versionCode 超出 Android 上限: ${versionCodeVal}")
}


android {
    namespace 'com.iptv.scanner.editor.pro'
    compileSdk 35

    defaultConfig {
        applicationId "com.iptv.scanner.editor.pro"
        minSdk 28
        targetSdk 35
        versionCode versionCodeVal
        versionName versionNameStr

        // ARM 架构通过 ndk.abiFilters 指定目标 ABI（Chaquopy 要求此属性）
        // 通过 -PtargetAbi=xxx 构建参数控制单 ABI 分包：
        //   gradlew assembleRelease -PtargetAbi=arm64-v8a   → 64 位 APK
        //   gradlew assembleRelease -PtargetAbi=armeabi-v7a → 32 位 APK
        // 不传参数时默认包含两个 ABI（通用包）
        // x86/x86_64 仅供模拟器，单独构建 debug 即可
        def targetAbi = project.findProperty('targetAbi')
        ndk {
            if (targetAbi != null) {
                abiFilters targetAbi.split(',')
            } else {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }

    /* APK 签名配置（用于 release 构建）
     * keystore 文件位于 android/app/release.keystore
     * 密码优先从环境变量或 local.properties 读取，避免硬编码在代码中
     * GitHub Actions 构建时通过环境变量注入密钥密码 */
    def keystorePwd = System.getenv('KEYSTORE_PASSWORD')
        ?: localProps.getProperty('keystorePassword') ?: ''
    def keyPwd = System.getenv('KEY_PASSWORD')
        ?: localProps.getProperty('keyPassword') ?: ''
    // release 任务缺少签名材料时必须阻断，不能静默产出未签名（无法安装/无法覆盖升级）的包
    def releaseTaskRequested = gradle.startParameter.taskNames.any {
        it.toLowerCase().contains('release')
    }
    if (!keystorePwd || !keyPwd) {
        if (releaseTaskRequested) {
            throw new GradleException(
                "release 构建缺少签名密钥密码：请配置环境变量 KEYSTORE_PASSWORD/KEY_PASSWORD，" +
                "或在 local.properties 中设置 keystorePassword/keyPassword；" +
                "未签名 release 包无法安装，构建已中止")
        }
        logger.warn("未配置 KEYSTORE_PASSWORD/KEY_PASSWORD，非 release 构建不受影响")
    }
    if (keystorePwd && keyPwd && !file('release.keystore').exists()) {
        throw new GradleException(
            "release.keystore 不存在，无法签名 release 包；" +
            "请把密钥材料从 CI secret 还原到 android/app/release.keystore")
    }
    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword keystorePwd
            keyAlias 'release'
            keyPassword keyPwd
        }
    }

    buildTypes {
        release {
            // 签名配置：仅在密钥密码可用时启用
            // CI/CD 通过环境变量注入，本地开发通过 local.properties 配置
            if (keystorePwd && keyPwd) {
                signingConfig signingConfigs.release
            }
            // 开启 R8 代码压缩 + 资源压缩：
            // - 移除未使用的 Kotlin/Java 类（classes.dex 从 50MB 减到 ~25MB）
            // - 移除未使用的资源
            // - proguard-rules.pro 保留 Chaquopy/MPV/Compose 反射类
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    /* 自定义 APK 输出文件名：包含版本号 + ABI，避免不同版本的产物同名
     *
     * 通过 -PtargetAbi=xxx 控制单 ABI 构建：
     * - gradlew assembleRelease -PtargetAbi=arm64-v8a   → GuangYu-Android-<version>-arm64.apk
     * - gradlew assembleRelease -PtargetAbi=armeabi-v7a → GuangYu-Android-<version>-arm32.apk
     * - 不传参数 → GuangYu-Android-<version>-universal.apk（含两个 ABI）
     *
     * versionCode 按 ABI 区分（确保各 ABI 的 versionCode 唯一）：
     * arm64-v8a: versionCode 不变（主版本）
     * armeabi-v7a: versionCode + 1（避免与 arm64 冲突）
     *
     * 测试包需要覆盖同版本号的旧安装时可传 -PversionCodeOffset=1：
     * 两个 ABI 的 versionCode 各自再加偏移（arm64 +1、arm32 +2），versionName 不变。 */
    def versionCodeOffset = (project.findProperty('versionCodeOffset') ?: '0').toInteger()
    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def targetAbi = project.findProperty('targetAbi')
            def abiSuffix = ''
            if (targetAbi != null) {
                if (targetAbi == 'arm64-v8a') {
                    abiSuffix = '-arm64'
                    output.versionCodeOverride = variant.versionCode + versionCodeOffset
                } else if (targetAbi == 'armeabi-v7a') {
                    abiSuffix = '-arm32'
                    // 32 位 versionCode 加 1 偏移，确保两个 APK 的 versionCode 不同
                    output.versionCodeOverride = variant.versionCode + versionCodeOffset + 1
                }
            } else {
                abiSuffix = '-universal'
            }
            output.outputFileName = "GuangYu-Android-${versionNameStr}${abiSuffix}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    /* Compose 构建特性：Kotlin 2.0+ 通过 org.jetbrains.kotlin.plugin.compose 插件
     * 编译 Compose 代码，不再需要 composeOptions { kotlinCompilerExtensionVersion } */
    buildFeatures {
        compose true
        // ACRA 需要 BuildConfig 类（AGP 8.x 默认不生成，需显式启用）
        buildConfig true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            /* 跨端配色单一真源：直接把仓库根 themes/ 挂进 assets（打包后为 assets/palette.json），
             * 不在 Android 侧另存/复制一份，PC 与 Android 永远读同一个文件。
             * directory 不存在时（例如单独构建 android 目录）跳过，运行时回退内置默认配色。 */
            def themeDir = new File(rootProject.projectDir.parentFile, 'themes')
            if (themeDir.isDirectory()) {
                assets.srcDirs += themeDir
            }
        }
    }

    /* native 库冲突处理：
     * - mpv 包含 libc++_shared.so，pickFirst 兜底 */
    packaging {
        jniLibs {
            pickFirsts += ['lib/*/libc++_shared.so']
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.11"
        // 显式指定 Python 解释器路径，从 local.properties 读取（如果设置）
        // local.properties 中支持两种形式：
        //   chaquopy.buildPython=C:/path/to/python.exe
        //   chaquopy.buildPython=py -3.11
        if (buildPythonPath != null) {
            // Groovy 的 spread 操作 (*) 把 List 展开为 vararg 参数
            def bpParts = buildPythonPath.tokenize(' ')
            buildPython(*bpParts)
        }
        pip {
            // Python 依赖已手动解压到 src/main/python/ 目录：
            // requests, urllib3, certifi, charset_normalizer, idna,
            // aiohttp(3.6.2纯Python), chardet, async_timeout, attrs,
            // multidict(纯Python回退), yarl(纯Python回退)
        }
        extractPackages "server"
    }
    sourceSets {
        getByName("main") {
            srcDir "src/main/python"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'

    /* Compose（阶段 0 技术验证起即引入）
     * - BOM 2024.10.01 与 Kotlin 2.0.21 + Compose Compiler 插件配套
     * - material3 提供 Material Design 3 组件
     * - material-icons-extended 提供完整图标集（遥控器 UI 需要的播放/暂停/快进等）
     * - activity-compose 提供 ComponentActivity.setContent 扩展
     * - lifecycle-runtime-compose / lifecycle-viewmodel-compose 提供 StateFlow.collectAsStateWithLifecycle */
    def composeBom = platform('androidx.compose:compose-bom:2024.10.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'com.google.zxing:core:3.5.3'

    /* Coil (Compose 图片加载库) - 用于频道台标显示
     * - 轻量级，Compose 原生
     * - 自动处理内存/磁盘缓存
     * - 用于 TvChannelItem 的频道 logo 加载 */
    implementation 'io.coil-kt:coil-compose:2.7.0'

    /* Haze - Compose backdrop blur（液态玻璃）
     * - 基于 RenderEffect 的取景模糊（API 31+），低版本自动 scrim 兜底
     * - 1.2.x 与 Compose BOM 2024.10.01（Compose 1.7）配套 */
    implementation 'dev.chrisbanes.haze:haze:1.2.2'

    /* Media3 (ExoPlayer) - 用于多画面副画面播放
     * MPV 在安卓端为单例，不支持多实例，副画面使用 ExoPlayer 独立播放。
     * - media3-exoplayer: 核心播放引擎
     * - media3-ui: PlayerView（SurfaceView 渲染）
     * - media3-exoplayer-hls: HLS 协议支持
     * - media3-exoplayer-dash: DASH 协议支持
     * - media3-exoplayer-rtsp: RTSP 协议支持 */
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.4.1'
    /* JLayer: 纯Java MPEG音频解码器，用于ExoPlayer解码MP2(audio/mpeg-L2)音频。
     * Android MediaCodec不支持MP2，用JLayer实现自定义ExoPlayer音频渲染器。 */
    implementation 'javazoom:jlayer:1.0.1'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    /* ACRA (Application Crash Reports for Android) - 崩溃日志收集
     *
     * - acra-core: 核心崩溃捕获引擎（Java 异常 UncaughtExceptionHandler）
     * - acra-toast: 崩溃时显示 Toast 提示用户
     *
     * 配置在 IptvApplication 中通过 @Acra 注解完成。
     * 崩溃报告保存到应用私有目录（getFilesDir()/acra-reports/），
     * 用户可在 设置 > 崩溃日志 中查看和导出。
     *
     * 原生崩溃（SIGSEGV）由 NativeCrashLogger 辅助捕获：
     * - 每次启动时开启后台 logcat 进程记录日志
     * - 下次启动检测上次是否异常退出，若是则保存 logcat 为崩溃报告 */
    implementation 'ch.acra:acra-core:5.9.7'
}

/* 构建前校验运行时资源：
 * - assets/shaders 为空 → 发布包所有 GLSL 预设静默失效
 * - jniLibs 为空     → 缺少 libmpv/AVS3，播放器直接不可用
 * - model.bin 缺失   → AV3A/AVS3 音频解码静默不可用（仅警告，允许先出包）
 * 这些资源由 android/extract_mpv_native.py 或 CI 生成，缺失时应尽早失败。 */
tasks.register('checkRuntimeAssets') {
    description = '校验 shaders / jniLibs / model.bin 是否齐全'
    group = 'verification'
    doLast {
        def shaderDir = file('src/main/assets/shaders')
        def shaderFiles = shaderDir.exists() ? (shaderDir.listFiles() ?: []).findAll { it.isFile() } : []
        if (shaderFiles.isEmpty()) {
            throw new GradleException("缺少着色器资源: ${shaderDir}，发布包的所有 GLSL 预设都会失效")
        }
        def jniLibsDir = file('src/main/jniLibs')
        def abiDirs = jniLibsDir.exists() ? (jniLibsDir.listFiles() ?: []).findAll { it.isDirectory() } : []
        if (abiDirs.isEmpty()) {
            throw new GradleException("jniLibs 为空: ${jniLibsDir}，请先运行 python android/extract_mpv_native.py")
        }
        // 只检查「存在任意 ABI 目录」不够：目标 ABI 目录可能存在但没有 native 库，
        // 打包出来的 APK 装上去直接无法播放。这里按目标 ABI 逐个校验必需库。
        def requiredLibs = ['libmpv.so', 'libplayer.so']
        def targetAbiProp = project.findProperty('targetAbi')
        if (targetAbiProp != null) {
            targetAbiProp.split(',').each { abi ->
                def abiName = abi.trim()
                requiredLibs.each { lib ->
                    def libFile = new File(jniLibsDir, "${abiName}/${lib}")
                    if (!libFile.exists()) {
                        throw new GradleException("目标 ABI ${abiName} 缺少 ${lib}: ${libFile}，" +
                            "该 APK 安装后播放器不可用；请重新运行 python android/extract_mpv_native.py 或检查构建产物")
                    }
                }
            }
        } else {
            def hasUsableAbi = ['arm64-v8a', 'armeabi-v7a'].any { abi ->
                requiredLibs.every { lib -> new File(jniLibsDir, "${abi}/${lib}").exists() }
            }
            if (!hasUsableAbi) {
                throw new GradleException("arm64-v8a / armeabi-v7a 均缺少 libmpv.so 或 libplayer.so，" +
                    "通用包安装后播放器不可用；请先运行 python android/extract_mpv_native.py")
            }
        }
        def modelFile = file('src/main/assets/model.bin')
        if (!modelFile.exists()) {
            logger.warn("警告: 缺少 ${modelFile}，AV3A/AVS3 音频解码将不可用；" +
                "请先运行 python android/extract_mpv_native.py")
        }
    }
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn 'checkRuntimeAssets'
}
