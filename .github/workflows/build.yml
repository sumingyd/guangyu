name: Build and Publish App

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload the executables to."
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  MPV_URL: "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260610/mpv-dev-x86_64-v3-20260610-git-304426c.7z"
  FFMPEG_URL: "https://github.com/GyanD/codexffmpeg/releases/download/2026-06-08-git-6028720d70/ffmpeg-2026-06-08-git-6028720d70-essentials_build.7z"
  FFMPEG_LINUX_ARM64_URL: "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linuxarm64-gpl-8.1.tar.xz"

jobs:
  validate-version:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check release tag matches core/version.py
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          CURRENT_VERSION=$(python3 - <<'PY'
          import pathlib
          import re
          import sys

          text = pathlib.Path("core/version.py").read_text(encoding="utf-8")
          match = re.search(r"CURRENT_VERSION\s*(?::\s*str\s*)?=\s*[\"']([^\"']+)[\"']", text)
          if not match:
              sys.exit("无法从 core/version.py 解析 CURRENT_VERSION")
          print(match.group(1))
          PY
          )
          # 允许 tag 带一个 v 前缀（v50.0.6.1），其余必须完全一致
          TAG_VERSION="${RELEASE_TAG#[vV]}"
          echo "release_tag=${RELEASE_TAG} -> ${TAG_VERSION}"
          echo "CURRENT_VERSION=${CURRENT_VERSION}"
          if [ "${TAG_VERSION}" != "${CURRENT_VERSION}" ]; then
            echo "::error::发布 tag(${TAG_VERSION}) 与 core/version.py 的 CURRENT_VERSION(${CURRENT_VERSION}) 不一致，请先同步版本号"
            exit 1
          fi

  build-windows:
    name: Build Windows EXE
    needs: validate-version
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Prepare MPV/FFmpeg
        shell: powershell
        run: |
          # 优先从项目 Release 下载带 CAVS Guangdian profile 支持的 libmpv
          # 如果 Release 不存在（未构建过），fallback 到官方 shinchiro 构建
          $cavsUrl = "https://github.com/${{ github.repository }}/releases/download/libmpv-cavs-latest/mpv-dev-x86_64-cavs.7z"
          try {
            Write-Host "Downloading CAVS-enabled libmpv from: $cavsUrl"
            Invoke-WebRequest -Uri $cavsUrl -OutFile "mpv.7z" -ErrorAction Stop
            Write-Host "Successfully downloaded CAVS-enabled libmpv"
          } catch {
            Write-Host "CAVS-enabled libmpv not found, falling back to official shinchiro build"
            Write-Host "Downloading mpv from: $env:MPV_URL"
            Invoke-WebRequest -Uri $env:MPV_URL -OutFile "mpv.7z"
          }
          7z x mpv.7z -ompv -y
          dir ./mpv

          Write-Host "Downloading ffmpeg from: $env:FFMPEG_URL"
          Invoke-WebRequest -Uri $env:FFMPEG_URL -OutFile "ffmpeg.7z"
          $ffmpegExtractDir = "_ffmpeg_extract"
          7z x ffmpeg.7z "-o$ffmpegExtractDir" -y

          $ffmpegBin = Get-ChildItem -Path $ffmpegExtractDir -Directory -Recurse |
            Where-Object { Test-Path (Join-Path $_.FullName "ffmpeg.exe") } |
            Select-Object -First 1

          if ($null -eq $ffmpegBin) {
            throw "Could not find ffmpeg.exe after extracting ffmpeg.7z."
          }
          if (Test-Path ".\ffmpeg") {
            Remove-Item ".\ffmpeg" -Recurse -Force
          }
          Move-Item -Path $ffmpegBin.FullName -Destination ".\ffmpeg"
          dir ./ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build executable
        run: python build.py

      - name: Verify and rename executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/GuangYu.exe")) {
            throw "Expected executable was not found"
          }
          Move-Item "dist/GuangYu.exe" "dist/GuangYu-Windows-x86_64.exe" -Force

      - name: Package libmpv fallback
        shell: pwsh
        run: |
          # 将 mpv/ 目录打包为 zip，作为 fallback 供用户手动下载
          # 当 onefile 模式解压 libmpv-2.dll 失败时，用户可从此 zip 提取 dll 放到 exe 同级目录
          if (Test-Path "mpv/libmpv-2.dll") {
            Compress-Archive -Path "mpv/libmpv-2.dll" -DestinationPath "dist/libmpv-fallback-windows.zip" -Force
            Write-Host "Created libmpv-fallback-windows.zip"
          } else {
            Write-Host "WARNING: mpv/libmpv-2.dll not found, skipping fallback package"
          }

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            dist/GuangYu-Windows-x86_64.exe
            dist/libmpv-fallback-windows.zip
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-arm64:
    name: Build macOS ARM64
    needs: validate-version
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download CAVS-enabled libmpv (macOS)
        # 优先从项目 Release 下载带 CAVS + AVS2 支持的 libmpv
        # 如果 Release 不存在，fallback 到 Homebrew（无 CAVS/AVS2 支持）
        run: |
          brew install ffmpeg
          mkdir -p mpv
          CAVS_URL="https://github.com/${{ github.repository }}/releases/download/libmpv-cavs-latest/libmpv-cavs-macos-arm64.tar.gz"
          if curl -fsSL "$CAVS_URL" -o /tmp/cavs-libmpv.tar.gz; then
            echo "Downloaded CAVS-enabled libmpv from: $CAVS_URL"
            mkdir -p /tmp/cavs-libmpv
            tar xzf /tmp/cavs-libmpv.tar.gz -C /tmp/cavs-libmpv
            cp /tmp/cavs-libmpv/libmpv-cavs-macos-arm64/lib/*.dylib mpv/
            echo "Using CAVS-enabled libmpv"
          else
            echo "CAVS-enabled libmpv not found, falling back to Homebrew"
            brew install mpv dylibbundler
            MPV_LIB="$(brew --prefix mpv)/lib/libmpv.2.dylib"
            cp "$MPV_LIB" mpv/libmpv.2.dylib
            # 只拷 libmpv 本体不够：它依赖 ffmpeg/libass 等 Homebrew dylib，
            # 用户机器上没有这些路径会直接加载失败（dyld: Library not loaded）。
            # 用 dylibbundler 把依赖一并收进 mpv/ 并改写成相对 @executable_path。
            dylibbundler -od -b -x mpv/libmpv.2.dylib -d mpv/ \
              -p "@executable_path/../Resources/mpv/"
            # dylibbundler 改写了 install_name，原签名失效，arm64 下必须重签
            codesign --force --sign - mpv/*.dylib
          fi
          ls -la mpv/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import code signing certificate
        # 仓库未配置证书时跳过，产物为未签名 .app（仅本地测试可用）
        if: ${{ secrets.MACOS_CERT_P12 != '' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > /tmp/macos_cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/macos_cert.p12 -k build.keychain \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          rm -f /tmp/macos_cert.p12

      - name: Build .app
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: python build.py

      - name: Package .app as zip
        run: |
          cd dist
          zip -r "GuangYu-macOS-ARM64.zip" "GuangYu.app"

      - name: Upload .app to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: dist/GuangYu-macOS-ARM64.zip
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-x86_64:
    name: Build Linux x86_64
    needs: validate-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y ffmpeg libxcb-cursor0 libass-dev zlib1g-dev libjpeg-dev

      - name: Download CAVS-enabled libmpv (Linux x86_64)
        # 优先从项目 Release 下载带 CAVS + AVS2 支持的 libmpv
        # 如果 Release 不存在，fallback 到 apt（无 CAVS/AVS2 支持）
        run: |
          mkdir -p mpv ffmpeg
          CAVS_URL="https://github.com/${{ github.repository }}/releases/download/libmpv-cavs-latest/libmpv-cavs-linux-x86_64.tar.gz"
          if curl -fsSL "$CAVS_URL" -o /tmp/cavs-libmpv.tar.gz; then
            echo "Downloaded CAVS-enabled libmpv from: $CAVS_URL"
            mkdir -p /tmp/cavs-libmpv
            tar xzf /tmp/cavs-libmpv.tar.gz -C /tmp/cavs-libmpv
            cp /tmp/cavs-libmpv/libmpv-cavs-linux-x86_64/lib/*.so* mpv/
            echo "Using CAVS-enabled libmpv"
          else
            echo "CAVS-enabled libmpv not found, falling back to apt"
            sudo apt install -y libmpv-dev
            cp /usr/lib/x86_64-linux-gnu/libmpv.so.2 mpv/ 2>/dev/null || cp /usr/lib/libmpv.so.2 mpv/ 2>/dev/null || true
          fi
          cp /usr/bin/ffprobe ffmpeg/
          cp /usr/bin/ffmpeg ffmpeg/ 2>/dev/null || true
          chmod +x ffmpeg/ffprobe ffmpeg/ffmpeg 2>/dev/null || true
          ls -la mpv/ ffmpeg/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build executable
        run: python build.py

      - name: Verify executable
        run: |
          if [ ! -f "dist/GuangYu" ]; then
            echo "Expected executable was not found"
            exit 1
          fi
          chmod +x "dist/GuangYu"
          file "dist/GuangYu"

      - name: Compress executable
        run: |
          cd dist
          tar czf "GuangYu-Linux-x86_64.tar.gz" "GuangYu" "icons" "GuangYu.desktop" "install.sh"

      - name: Upload executable to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: dist/GuangYu-Linux-x86_64.tar.gz
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-arm64:
    name: Build Linux ARM64
    needs: validate-version
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y libxcb-cursor0 libass-dev zlib1g-dev libjpeg-dev

      - name: Download CAVS-enabled libmpv (Linux ARM64)
        # 优先从项目 Release 下载带 CAVS + AVS2 支持的 libmpv
        # 如果 Release 不存在，fallback 到 apt（无 CAVS/AVS2 支持）
        run: |
          mkdir -p mpv ffmpeg
          CAVS_URL="https://github.com/${{ github.repository }}/releases/download/libmpv-cavs-latest/libmpv-cavs-linux-arm64.tar.gz"
          if curl -fsSL "$CAVS_URL" -o /tmp/cavs-libmpv.tar.gz; then
            echo "Downloaded CAVS-enabled libmpv from: $CAVS_URL"
            mkdir -p /tmp/cavs-libmpv
            tar xzf /tmp/cavs-libmpv.tar.gz -C /tmp/cavs-libmpv
            cp /tmp/cavs-libmpv/libmpv-cavs-linux-arm64/lib/*.so* mpv/
            echo "Using CAVS-enabled libmpv"
          else
            echo "CAVS-enabled libmpv not found, falling back to apt"
            sudo apt install -y libmpv-dev
            cp /usr/lib/aarch64-linux-gnu/libmpv.so.2 mpv/ 2>/dev/null || cp /usr/lib/libmpv.so.2 mpv/ 2>/dev/null || true
          fi
          ls -la mpv/

      - name: Prepare FFmpeg
        run: |
          mkdir -p ffmpeg

          # Try BtbN FFmpeg build first
          echo "Trying BtbN FFmpeg ARM64 build..."
          wget -q "$FFMPEG_LINUX_ARM64_URL" -O /tmp/ffmpeg-arm64.tar.xz 2>/dev/null && {
            tar -xf /tmp/ffmpeg-arm64.tar.xz -C /tmp/
            find /tmp -name "ffprobe" -type f -exec cp {} ffmpeg/ \;
            find /tmp -name "ffmpeg" -type f -exec cp {} ffmpeg/ \;
          } || echo "BtbN download failed, trying apt..."

          # Fallback: use system ffmpeg from apt
          if [ ! -f ./ffmpeg/ffprobe ]; then
            echo "Using system ffmpeg from apt..."
            sudo apt install -y ffmpeg
            cp /usr/bin/ffprobe ffmpeg/
            cp /usr/bin/ffmpeg ffmpeg/
          fi

          if [ ! -f ./ffmpeg/ffprobe ]; then
            echo "ffprobe not found"
            exit 1
          fi

          chmod +x ffmpeg/ffprobe ffmpeg/ffmpeg 2>/dev/null || true
          ls -la ffmpeg/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable
        run: python build.py

      - name: Verify executable
        run: |
          if [ ! -f "dist/GuangYu" ]; then
            echo "Expected executable was not found"
            exit 1
          fi
          chmod +x "dist/GuangYu"
          file "dist/GuangYu"

      - name: Compress executable
        run: |
          cd dist
          tar czf "GuangYu-Linux-ARM64.tar.gz" "GuangYu" "icons" "GuangYu.desktop" "install.sh"

      - name: Upload executable to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: dist/GuangYu-Linux-ARM64.tar.gz
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android APK
    needs: validate-version
    runs-on: ubuntu-latest
    env:
      # AVS 支持版 libmpv 发布标签（sggc/mpv-android-avs，自动递增 tag，
      # 升级时 bump 此值即可），提供 CAVS/AVS2/AVS3-P2/AV3A 解码支持
      MPV_AVS_RELEASE: "libmpv-cavs-dynamic-v003"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python 3.11 (for Chaquopy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # 2026-09 起 runner 预装 sdkmanager 版本变更触发 action 下载 cmdline-tools 16.0，
        # 其内部 "sdkmanager --licenses" 交互确认在 CI 无 stdin 环境下失败（exit 1）。
        # 此时 SDK 工具本身已安装完成，故容忍该失败，由下一步显式接受许可。
        continue-on-error: true

      - name: Accept Android SDK licenses
        # setup-android 失败中断时不会把 sdkmanager 写入 PATH，需按绝对路径解析
        run: |
          SDKM=$(ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKM" --licenses > /dev/null

      - name: Install Android SDK packages
        run: |
          SDKM=$(ls /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          yes | "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Download mpv-android .so files (official base + AVS overlay)
        # 安卓端 libmpv 来源：
        # 1. 官方 mpv-android APK（基座）：提供 libplayer.so（mpv-android 的 JNI 层，
        #    MPVLib.kt 需同时加载 libmpv 与 libplayer）与 libc++_shared.so
        #    （davs2 为 C++ 编译，dlopen 时必需）
        # 2. sggc/mpv-android-avs（覆盖）：带 CAVS/AVS2/AVS3-P2/AV3A 解码支持的
        #    libmpv.so / libavcodec.so / libdavs2.so / libuavs3d.so /
        #    libavs3a_decoder.so 等一套 .so，覆盖 arm64-v8a / armeabi-v7a
        # 3. assets/model.bin：AV3A(Audio Vivid) 解码器运行时模型，
        #    由 IptvApplication 启动时拷贝到 filesDir 供 libavs3a_decoder 读取
        working-directory: android
        run: |
          JNILIBS_DIR="app/src/main/jniLibs"
          ASSETS_DIR="app/src/main/assets"
          mkdir -p "$JNILIBS_DIR" "$ASSETS_DIR"

          # --- 1) 官方基座 ---
          BASE_URL="https://github.com/mpv-android/mpv-android/releases/download/2026-04-25"
          ARCHS=("arm64-v8a" "armeabi-v7a")
          for arch in "${ARCHS[@]}"; do
            APK="app-default-${arch}-release.apk"
            curl -fsSL -o "mpv-${arch}.apk" "${BASE_URL}/${APK}"
            echo "Downloaded mpv-${arch}.apk ($(ls -lh "mpv-${arch}.apk" | awk '{print $5}'))"
            mkdir -p "$JNILIBS_DIR/$arch"
            unzip -o "mpv-${arch}.apk" "lib/${arch}/*.so" -d /tmp/mpv-extract
            if [ -d "/tmp/mpv-extract/lib/${arch}" ]; then
              cp /tmp/mpv-extract/lib/${arch}/*.so "$JNILIBS_DIR/$arch/"
            else
              echo "ERROR: No .so files found for $arch"
              exit 1
            fi
            rm -rf /tmp/mpv-extract "mpv-${arch}.apk"
          done

          # --- 2) AVS 支持版覆盖 ---
          AVS_URL="https://github.com/sggc/mpv-android-avs/releases/download/${MPV_AVS_RELEASE}/libmpv-cavs-android-dynamic.tar.gz"
          echo "Downloading AVS-enabled libmpv from: $AVS_URL"
          curl -fsSL -o /tmp/mpv-avs.tar.gz "$AVS_URL"
          mkdir -p /tmp/mpv-avs-extract
          for arch in "${ARCHS[@]}"; do
            tar xzf /tmp/mpv-avs.tar.gz -C /tmp/mpv-avs-extract "jniLibs/${arch}" 2>/dev/null || true
            if ls /tmp/mpv-avs-extract/jniLibs/${arch}/*.so >/dev/null 2>&1; then
              cp /tmp/mpv-avs-extract/jniLibs/${arch}/*.so "$JNILIBS_DIR/$arch/"
              echo "$arch AVS overlay done"
            else
              echo "ERROR: No AVS .so files found for $arch"
              exit 1
            fi
          done

          # --- 3) AV3A 解码模型 ---
          tar xzf /tmp/mpv-avs.tar.gz -C /tmp/mpv-avs-extract "assets/model.bin"
          cp /tmp/mpv-avs-extract/assets/model.bin "$ASSETS_DIR/model.bin"
          rm -rf /tmp/mpv-avs.tar.gz /tmp/mpv-avs-extract

          echo "=== Final jniLibs structure ==="
          find "$JNILIBS_DIR" -name "*.so" -ls
          echo "=== assets ==="
          ls -la "$ASSETS_DIR/model.bin"

      - name: Create local.properties
        working-directory: android
        run: |
          # 查找 setup-python 安装的 Python 3.11 可执行文件路径
          PYTHON_PATH=$(which python3.11 2>/dev/null || which python3 2>/dev/null || echo "python3")
          echo "chaquopy.buildPython=$PYTHON_PATH" > local.properties
          echo "Using Python: $PYTHON_PATH"

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build arm64 release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PtargetAbi=arm64-v8a

      - name: Stash arm64 APK
        working-directory: android
        run: |
          mkdir -p apk-output
          cp app/build/outputs/apk/release/GuangYu-Android-*-arm64.apk apk-output/

      - name: Clean before arm32 build
        working-directory: android
        run: ./gradlew clean

      - name: Build arm32 release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PtargetAbi=armeabi-v7a

      - name: Stash arm32 APK
        working-directory: android
        run: |
          cp app/build/outputs/apk/release/GuangYu-Android-*-arm32.apk apk-output/

      - name: Verify APKs
        id: apk
        working-directory: android
        run: |
          echo "=== All APK files ==="
          ls -la apk-output/

          ARM64_APK=$(ls apk-output/GuangYu-Android-*-arm64.apk 2>/dev/null | head -1)
          ARM32_APK=$(ls apk-output/GuangYu-Android-*-arm32.apk 2>/dev/null | head -1)

          if [ -z "$ARM64_APK" ]; then
            echo "ERROR: arm64 APK not found"
            exit 1
          fi
          if [ -z "$ARM32_APK" ]; then
            echo "ERROR: arm32 APK not found"
            exit 1
          fi

          echo "arm64 APK: $ARM64_APK ($(ls -lh "$ARM64_APK" | awk '{print $5}'))"
          echo "arm32 APK: $ARM32_APK ($(ls -lh "$ARM32_APK" | awk '{print $5}'))"

          # 输出 glob 模式（相对于仓库根目录），匹配两个带版本号的 APK
          echo "apk_glob=android/apk-output/GuangYu-Android-*.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APKs to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: ${{ steps.apk.outputs.apk_glob }}
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

